- id: lint
  name: Lint (S)CSS
  entry: paulhfischer-stylelint
  language: node
  args:
    - '--fix'
    - '--allow-empty-input'
  additional_dependencies:
    - '@stylistic/stylelint-plugin@5.3.1'
    - postcss@8.5.30
    - postcss-html@2.0.0
    - stylelint@17.16.0
    - stylelint-config-html@2.0.0
    - stylelint-config-standard-scss@17.0.0
  types:
    - file
  files: \.(css|scss|html|php)$
  exclude: ((^|/)node_modules/|\.min\.css$)
